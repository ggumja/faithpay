name: Daily Recurring Billing Batch Scheduler

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST (한국 표준시 매일 아침 9시 자동 정기결제 배치 실행)
    - cron: '0 0 * * *'
  workflow_dispatch: # 관리자 수동 즉시 실행 가능

jobs:
  run-recurring-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SoulPay Recurring Billing Batch
        run: |
          echo "Triggering SoulPay Recurring Payment Batch Scheduler..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://aoognbmkstgrytkqsexy.supabase.co/functions/v1/make-server-d0d82cc7/payment/recurring/batch-run" \
            -H "Content-Type: application/json")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "HTTP Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Recurring batch execution failed with HTTP status $STATUS"
            exit 1
          fi
